AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
    backend-sam-app

Globals:
    Function:
        Timeout: 7

Resources:
    GetS3KeysAndURLsFunctionTest:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: get-s3-keys-and-urls/
            Handler: app.lambda_handler
            Policies:
                Statement:
                    Effect: Allow
                    Action:
                        - 's3:GetObject'
                        - 's3:ListBucket'
                    Resource: !GetAtt FilesBucket.Arn
            Runtime: python3.14
            Architectures:
                - x86_64
            Events:
                GetS3KeysAndURLs:
                    Type: Api
                    Properties:
                        Path: /get-s3-keys-and-urls-test
                        Method: post
    FilesBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: 'user-restricted-files-test'
    FilesBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref FilesBucket
            PolicyDocument:
                Statement:
                    Effect: Deny
                    Principal: '*'
                    Action: 's3:*'
                    Resource: !GetAtt FilesBucket.Arn
                    Condition:
                        Bool:
                            aws:SecureTransport: false
    WebsiteBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: 'user-restricted-files-website-test'
    WebsiteBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref WebsiteBucket
            PolicyDocument:
                Version: 2008-10-17
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: 'cloudfront.amazonaws.com'
                      Action: 's3:GetObject'
                      Resource: !Ref WebsiteBucket
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !ref WebsiteDistribution
    WebsiteDistribution:
        Type: AWS::CloudFront::Distribution
        Properties:
            DistributionConfig:
                DefaultCacheBehavior:
                    CachePolicyId: '4135ea2d-6df8-44a3-9df3-4b5a84be39ad'
                    TargetOriginId: !Ref WebsiteBucket
                    ViewerProtocolPolicy: 'https-only'
                DefaultRootObject: index.html
                Enabled: true
                Origins:
                    - CustomOriginConfig:
                          OriginProtocolPolicy: 'https-only'
                      DomainName: !GetAtt WebsiteBucket.RegionalDomainName
                      Id: !Ref WebsiteBucket
                      OriginAccessControlId: !Ref WebsiteDistributionOAC
    WebsiteDistributionOAC:
        Type: AWS::CloudFront::OriginAccessControl
        Properties:
            OriginAccessControlConfig:
                Name: 'user-restricted-files-website-oac'
                OriginAccessControlOriginType: s3
                SigningBehavior: always
                SigningProtocol: sigv4
    WebsiteDistributionHeadersPolicy:
        Type: AWS::CloudFront::ResponseHeadersPolicy
        Properties:
            ResponseHeadersPolicyConfig:
                CorsConfig:
                    AccessControlAllowCredentials: false
                    AccessControlAllowHeaders:
                        Items:
                            - Access-Control-Allow-Origin
                    AccessControlAllowMethods:
                        Items:
                            - OPTIONS
                            - POST
                    AccessControlAllowOrigins:
                        Items:
                            - !GetAtt WebsiteDistribution.DomainName
                    OriginOverride: true
                CustomHeadersConfig:
                    Items:
                        - Header: 'Content-Type'
                          Override: true
                          Value: 'application/json'
                Name: 'user-restricted-files-website-policy-test'
    WebsiteUserPool:
        Type: AWS::Cognito::UserPool
        Properties:
            EmailConfiguration:
                EmailSendingAccount: 'DEVELOPER'
                From: 'qiveal@gmail.com'
                SourceArn: 'arn:aws:ses:us-east-1:279706066644:identity/qiveal@gmail.com'
            Schema:
                - AttributeDataType: String
                  Mutable: true
                  Name: 's3-prefix'
            UsernameAttributes:
                - email
            UserPoolName: 'user-restricted-files-test'
    WebsiteUserPoolClient:
        Type: AWS::Cognito::UserPoolClient
        Properties:
            ClientName: 'user-restricted-files-website-test'
            ExplicitAuthFlows:
                - ALLOW_USER_AUTH
            UserPoolId: !Ref WebsiteUserPool
            WriteAttributes:
                - email
