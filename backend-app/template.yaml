AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
    user-restricted-file-system-backend-sam-app

Globals:
    Api:
        Cors:
            AllowHeaders: "'Content-Type'"
            AllowMethods: "'POST,OPTIONS'"
            AllowOrigin: !Sub
                - "'https://${WebsiteDomain}'"
                - WebsiteDomain: !GetAtt WebsiteDistribution.DomainName
    Function:
        Timeout: 60

Resources:
    GetS3ObjectDataFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: get-s3-object-data/
            Handler: app.lambda_handler
            Policies:
                Statement:
                    - Effect: Allow
                      Action:
                          - 's3:GetObject'
                      Resource: !Sub
                          - '${FilesBucketArn}/*'
                          - FilesBucketArn: !GetAtt FilesBucket.Arn
                    - Effect: Allow
                      Action:
                          - 's3:ListBucket'
                      Resource: !GetAtt FilesBucket.Arn
            Runtime: python3.14
            Architectures:
                - x86_64
            Environment:
                Variables:
                    S3BucketName: !Ref FilesBucket
                    WebsiteDomain: !Sub
                        - 'https://${WebsiteDistributionDomain}'
                        - WebsiteDistributionDomain: !GetAtt WebsiteDistribution.DomainName
            Events:
                GetS3ObjectData:
                    Type: Api
                    Properties:
                        Path: /s3-object-data
                        Method: post
    FilesBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: 'REPLACE_WITH_NAME'
            CorsConfiguration:
                CorsRules:
                    - AllowedHeaders:
                          - '*'
                      AllowedMethods:
                          - GET
                      AllowedOrigins:
                          - !Sub
                            - 'https://${WebsiteDistributionDomain}'
                            - WebsiteDistributionDomain: !GetAtt WebsiteDistribution.DomainName
    FilesBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref FilesBucket
            PolicyDocument:
                Statement:
                    Effect: Deny
                    Principal: '*'
                    Action: 's3:*'
                    Resource: !GetAtt FilesBucket.Arn
                    Condition:
                        Bool:
                            aws:SecureTransport: false
    WebsiteBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: 'REPLACE_WITH_NAME'
    WebsiteBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref WebsiteBucket
            PolicyDocument:
                Version: 2012-10-17
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: 'cloudfront.amazonaws.com'
                      Action: 's3:GetObject'
                      Resource: !Sub
                          - '${WebsiteBucketArn}/*'
                          - WebsiteBucketArn: !GetAtt WebsiteBucket.Arn
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub
                                  - 'arn:aws:cloudfront::${AccountId}:distribution/${WebsiteDistributionId}'
                                  - AccountId: !Ref AWS::AccountId
                                    WebsiteDistributionId: !Ref WebsiteDistribution
    WebsiteDistribution:
        Type: AWS::CloudFront::Distribution
        Properties:
            DistributionConfig:
                DefaultCacheBehavior:
                    CachePolicyId: '4135ea2d-6df8-44a3-9df3-4b5a84be39ad'
                    TargetOriginId: !Ref WebsiteBucket
                    ViewerProtocolPolicy: 'https-only'
                DefaultRootObject: index.html
                Enabled: true
                Origins:
                    - S3OriginConfig:
                          OriginReadTimeout: 30
                      DomainName: !GetAtt WebsiteBucket.RegionalDomainName
                      Id: !Ref WebsiteBucket
                      OriginAccessControlId: !Ref WebsiteDistributionOAC
    WebsiteDistributionOAC:
        Type: AWS::CloudFront::OriginAccessControl
        Properties:
            OriginAccessControlConfig:
                Name: 'REPLACE_WITH_NAME'
                OriginAccessControlOriginType: s3
                SigningBehavior: always
                SigningProtocol: sigv4
    WebsiteUserPool:
        Type: AWS::Cognito::UserPool
        Properties:
            EmailConfiguration:
                EmailSendingAccount: 'DEVELOPER'
                From: 'REPLACE_WITH_EMAIL'
                SourceArn: 'arn:aws:ses:us-east-1:279706066644:identity/REPLACE_WITH_EMAIL'
            Policies:
                SignInPolicy:
                    AllowedFirstAuthFactors:
                        - EMAIL_OTP
                        - PASSWORD
            Schema:
                - AttributeDataType: String
                  Mutable: true
                  Name: 's3-prefix'
            UsernameAttributes:
                - email
            UserPoolName: 'REPLACE_WITH_NAME'
    WebsiteUserPoolDomain:
        Type: AWS::Cognito::UserPoolDomain
        Properties:
            Domain: REPLACE_WITH_NAME
            ManagedLoginVersion: 2
            UserPoolId: !Ref WebsiteUserPool
    WebsiteUserPoolManagedLoginBranding:
        Type: AWS::Cognito::ManagedLoginBranding
        Properties:
            UserPoolId: !Ref WebsiteUserPool
            ClientId: !Ref WebsiteUserPoolClient
            UseCognitoProvidedValues: true
    WebsiteUserPoolClient:
        Type: AWS::Cognito::UserPoolClient
        Properties:
            AllowedOAuthFlows:
                - code
            AllowedOAuthFlowsUserPoolClient: true
            AllowedOAuthScopes:
                - aws.cognito.signin.user.admin
                - email
                - openid
            CallbackURLs:
                - !Sub
                  - 'https://${WebsiteDomain}'
                  - WebsiteDomain: !GetAtt WebsiteDistribution.DomainName
            ClientName: 'REPLACE_WITH_NAME'
            ExplicitAuthFlows:
                - ALLOW_USER_AUTH
            SupportedIdentityProviders:
                - COGNITO
            UserPoolId: !Ref WebsiteUserPool
            WriteAttributes:
                - email
